[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "projection-pen"
version = "0.1.1"
description = "Offline camera-tracked projection whiteboard"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "opencv-contrib-python-headless>=4.10,<5", "PySide6>=6.7,<7", "cv2-enumerate-cameras>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
projection-pen = "projection_pen.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
