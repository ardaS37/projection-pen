name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 fontconfig libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxtst6 xvfb xauth
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: projection-pen --smoke-test
      - name: Native X11 global shortcut integration
        if: runner.os == 'Linux'
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb python -m pytest -q tests/test_shortcuts_x11.py
